<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Library – Evan Stonerock</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Inter font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">

  <style>
    .book-entry {
      margin-bottom: 40px;
    }
    .book-cover {
      width: 160px;
      border-radius: 8px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.6);
      margin-bottom: 16px;
    }
    .note-images {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 16px;
    }
    .note-images img {
      width: 160px;
      border-radius: 8px;
      border: 1px solid #333;
      box-shadow: 0 6px 18px rgba(0,0,0,0.6);
    }
    .quotes-box {
      background: #222;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 16px;
      margin-top: 18px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.6);
    }
    .quotes-box h4 {
      margin-bottom: 10px;
      color: #f5f5f5;
      font-size: 1.1rem;
    }
    .quotes-box ul {
      margin: 0;
      padding-left: 18px;
    }
    .quotes-box li {
      margin-bottom: 6px;
      color: #ccc;
    }
  </style>
</head>

<body>

  <!-- NAVIGATION -->
  <nav class="fade-in">
    <a href="index.html">Home</a>
    <a href="resume.html">Resume</a>

    <a href="library.html" class="active">Library</a>
  </nav>

  <h1 class="fade-in">Library</h1>

  <div class="card fade-in" style="text-align:center;">
    A running list of books I’ve read, with journal pages and favorite quotes.
  </div>

  <!-- ============================
       BOOK TEMPLATE — COPY THIS
       ============================ -->
  <div class="card fade-in book-entry">
    <h3>Book Title – Author</h3>
    <p class="book-meta"><em>Finished: Month Year</em></p>

    <!-- COVER IMAGE -->
    <img src="book-cover.jpg" alt="Book Cover" class="book-cover">

    <!-- JOURNAL IMAGES -->
    <div class="note-images">
      <img src="book-notes-1.jpg" alt="Journal page 1">
      <img src="book-notes-2.jpg" alt="Journal page 2">
    </div>

    <!-- FAVORITE QUOTES -->
    <div class="quotes-box">
      <h4>Favorite Quotes</h4>
      <ul>
        <li>“Example quote from the book.”</li>
        <li>“Another quote you liked.”</li>
      </ul>
    </div>
  </div>
